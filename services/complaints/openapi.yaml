openapi: 3.0.3
info:
  title: Nivaaran Complaints Service
  version: 1.0.0
  description: >
    Central grievance orchestrator for campus redressal.
    Supports complete HTTP/REST semantics including conditional requests (ETag / If-Match / If-None-Match),
    safe idempotency, bearer authentication, rate limiting, and RFC 7807 problem details.
servers:
  - url: http://localhost:8082
    description: Local development server
  - url: https://api.nivaaran.internal/complaints
    description: Internal cluster gateway

paths:
  /complaints:
    options:
      summary: Discover allowed methods and CORS preflight
      responses:
        '204':
          description: Preflight and method discovery
          headers:
            Allow:
              schema: { type: string, example: "GET, POST, OPTIONS" }
            Access-Control-Allow-Origin:
              schema: { type: string, example: "*" }

    post:
      summary: File a new grievance complaint
      description: Submits a complaint. Protected by Bearer token. Supports Idempotency-Key.
      parameters:
        - in: header
          name: Authorization
          required: true
          schema: { type: string, example: "Bearer eyJhbG..." }
          description: Bearer authentication token
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, example: "8f4a-912b-47e1" }
          description: Client-generated unique token to safely retry filing
        - in: header
          name: X-HTTP-Method-Override
          required: false
          schema: { type: string, example: "PATCH" }
          description: Fallback method override for constrained clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201':
          description: Complaint created successfully
          headers:
            Location:
              schema: { type: string, example: "/complaints/cmp_1001" }
            ETag:
              schema: { type: string, example: '"1-a8f9c1"' }
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
            application/xml:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
        '200':
          description: Idempotent repeat returned without creating duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
        '400':
          description: Malformed JSON syntax in request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid Authorization Bearer token
          headers:
            WWW-Authenticate:
              schema: { type: string, example: 'Bearer realm="nivaaran-complaints"' }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Field-level validation failure (collects all field errors)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema: { type: integer, example: 60 }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Downstream Accounts service unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      summary: List and filter complaints
      description: Returns a list of complaints filtered by category or status. Pure read with query parameters.
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [hostel, mess, campus] }
        - in: query
          name: status
          schema: { type: string, enum: [submitted, assigned, in_progress, resolved, closed] }
        - in: header
          name: Accept
          schema: { type: string, default: "application/json" }
      responses:
        '200':
          description: List of complaints
          headers:
            Cache-Control:
              schema: { type: string, example: "max-age=30, private" }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintRepresentation'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComplaintRepresentation'
        '400':
          description: Invalid query filter parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Requested Accept media type cannot be produced
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /complaints/{id}:
    options:
      summary: Discover allowed methods for single item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Allowed methods returned
          headers:
            Allow:
              schema: { type: string, example: "GET, PATCH, DELETE, OPTIONS" }

    get:
      summary: Read a single complaint (Safe, Cacheable, Conditional)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: If-None-Match
          required: false
          schema: { type: string, example: '"1-a8f9c1"' }
        - in: header
          name: Accept
          schema: { type: string, default: "application/json" }
      responses:
        '200':
          description: Complaint representation
          headers:
            ETag:
              schema: { type: string, example: '"1-a8f9c1"' }
            Cache-Control:
              schema: { type: string, example: "max-age=60, private, must-revalidate" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
            application/xml:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
        '304':
          description: Not Modified (cached client copy is fresh, no body returned)
        '404':
          description: Complaint not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Not Acceptable media type
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    patch:
      summary: Modify complaint fields (Conditional Write with If-Match)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: false
          schema: { type: string, example: '"1-a8f9c1"' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchComplaintRequest'
      responses:
        '200':
          description: Complaint updated
          headers:
            ETag:
              schema: { type: string, example: '"2-d7b3e4"' }
            Cache-Control:
              schema: { type: string, example: "no-store" }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
        '401':
          description: Unauthorized
        '404':
          description: Complaint not found
        '412':
          description: Precondition Failed (ETag mismatch prevents lost update)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Field validation failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      summary: Cancel or withdraw draft complaint (Idempotent)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Complaint withdrawn successfully (no content returned)
        '401':
          description: Unauthorized
        '404':
          description: Complaint not found
        '409':
          description: State Conflict (cannot delete complaint already assigned or in-progress)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /complaints/{id}/escalate:
    post:
      summary: Escalate an overdue complaint (State-changing sub-resource)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Authorization
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateRequest'
      responses:
        '200':
          description: Complaint escalated successfully
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintRepresentation'
        '401':
          description: Unauthorized
        '404':
          description: Complaint not found
        '409':
          description: State Conflict (already in escalated state)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Validation failure for escalation body

components:
  schemas:
    CreateComplaintRequest:
      type: object
      required:
        - userId
        - categoryId
        - locationId
        - title
        - description
      properties:
        userId:
          type: string
          example: "20251651078"
        categoryId:
          type: string
          enum: [hostel, mess, campus]
          example: "hostel"
        locationId:
          type: string
          example: "hostel_block_a"
        title:
          type: string
          minLength: 5
          maxLength: 120
          example: "Severe water leakage in room 302"
        description:
          type: string
          minLength: 10
          maxLength: 2000
          example: "Bathroom tap broken and leaking continuously."
        priority:
          type: string
          enum: [normal, urgent]
          default: normal
        isAnonymous:
          type: boolean
          default: false

    PatchComplaintRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 10
        priority:
          type: string
          enum: [normal, urgent]
        status:
          type: string
          enum: [submitted, assigned, in_progress, resolved, closed]

    ComplaintRepresentation:
      type: object
      required:
        - id
        - trackingNumber
        - categoryId
        - locationId
        - title
        - description
        - priority
        - status
        - isEscalated
        - createdAt
      properties:
        id:
          type: string
          example: "cmp_1001"
        trackingNumber:
          type: string
          example: "CMP-2026-1001"
        reporterId:
          type: string
          nullable: true
          example: "20251651078"
        categoryId:
          type: string
          example: "hostel"
        locationId:
          type: string
          example: "hostel_block_a"
        title:
          type: string
          example: "Severe water leakage in room 302"
        description:
          type: string
          example: "Bathroom tap broken and leaking continuously."
        priority:
          type: string
          example: "normal"
        status:
          type: string
          example: "submitted"
        isEscalated:
          type: boolean
          example: false
        slaDeadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EscalateRequest:
      type: object
      required:
        - initiatorId
        - reason
      properties:
        initiatorId:
          type: string
          example: "20251651078"
        reason:
          type: string
          minLength: 5
          example: "SLA turnaround expired without staff assignment"

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: "/errors/validation-failed"
        title:
          type: string
          example: "Validation Failed"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "Request body validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              msg: { type: string }
          example:
            - field: "title"
              msg: "length must be between 5 and 120 characters"
            - field: "categoryId"
              msg: "required string; must be one of: hostel, mess, campus"
