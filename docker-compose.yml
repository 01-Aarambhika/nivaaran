version: '3.9'

# Nivaaran — Campus Grievance Redressal Platform
# All 6 microservices + MySQL 8.0 Database
# Start everything: docker compose up --build
# Stop:            docker compose down

services:

  # ── MySQL 8.0 Database ───────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nivaaran_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root123}
    volumes:
      - ./database/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - nivaaran_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Service 1: Accounts (port 8080) ──────────────────────────────────────────
  accounts:
    build: ./services/accounts
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-nivaaran-dev-secret}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: nivaaran_accounts
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/users', r => process.exit(r.statusCode === 401 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 2: Directory (port 8081) ─────────────────────────────────────────
  directory:
    build: ./services/directory
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-nivaaran-dev-secret}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: nivaaran_directory
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081/categories', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 3: Complaints (port 8082) ────────────────────────────────────────
  complaints:
    build: ./services/complaints
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-nivaaran-dev-secret}
      ACCOUNTS_URL: http://accounts:8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: nivaaran_complaints
    depends_on:
      mysql:
        condition: service_healthy
      accounts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8082/complaints', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 4: Resolution (port 8083) ────────────────────────────────────────
  resolution:
    build: ./services/resolution
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-nivaaran-dev-secret}
      ACCOUNTS_URL: http://accounts:8080
      COMPLAINTS_URL: http://complaints:8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: nivaaran_resolution
    depends_on:
      mysql:
        condition: service_healthy
      accounts:
        condition: service_healthy
      complaints:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8083/roster', r => process.exit(r.statusCode === 401 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 5: Notifications (port 8084) ─────────────────────────────────────
  notifications:
    build: ./services/notifications
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET:-nivaaran-dev-secret}
      ACCOUNTS_URL: http://accounts:8080
      SMS_PARTNER_URL: http://partner.gateway.example/api
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: nivaaran_notifications
    depends_on:
      mysql:
        condition: service_healthy
      accounts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8084/notifications', r => process.exit(r.statusCode === 401 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Service 6: Analytics & Audit (port 8085) ─────────────────────────────────
  analytics:
    build: ./services/analytics
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      JWT_SECRET: ${JWT_SECRET:-nivaaran-dev-secret}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root123}
      MYSQL_DATABASE: nivaaran_analytics
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8085/audit/events', r => process.exit(r.statusCode === 401 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Frontend: React Client (port 5173) ───────────────────────────────────────
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      VITE_ACCOUNTS_URL: http://localhost:8080
      VITE_DIRECTORY_URL: http://localhost:8081
      VITE_COMPLAINTS_URL: http://localhost:8082
      VITE_RESOLUTION_URL: http://localhost:8083
      VITE_NOTIFICATIONS_URL: http://localhost:8084
      VITE_ANALYTICS_URL: http://localhost:8085
    depends_on:
      - complaints
      - accounts
    restart: unless-stopped

volumes:
  nivaaran_mysql_data:
